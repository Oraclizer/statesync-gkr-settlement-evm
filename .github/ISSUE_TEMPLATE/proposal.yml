name: Proposal
description: Propose a behavior, interface, dependency, or policy change before opening a pull request.
title: "proposal: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        CONTRIBUTING.md asks for an issue first on substantial changes. Do not disclose vulnerabilities here; report them privately as described in SECURITY.md.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing today, and who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the change and its claim boundary. Name the affected surfaces (storage, authorization, interfaces, toolchain, policy).
    validations:
      required: true

  - type: textarea
    id: verification
    attributes:
      label: Verification plan
      description: How would the change be tested (deterministic tests, fuzzing, invariants) and what evidence would accompany it?
    validations:
      required: true

  - type: checkboxes
    id: hygiene
    attributes:
      label: Hygiene
      options:
        - label: This proposal contains no credentials, private keys, wallet material, private RPC URLs, internal paths, or confidential code.
          required: true
