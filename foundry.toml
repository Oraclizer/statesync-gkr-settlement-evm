[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["lib"]

solc_version = "0.8.36"
auto_detect_solc = false
offline = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

ffi = false
fs_permissions = [{ access = "read", path = "./vectors" }]
bytecode_hash = "none"
cbor_metadata = false
use_literal_content = true
deny = "warnings"
script_execution_protection = true

[fuzz]
runs = 1024
seed = "0x000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
fail_on_revert = true
max_test_rejects = 65536

[invariant]
runs = 256
depth = 128
fail_on_revert = true
call_override = false
max_assume_rejects = 65536

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
wrap_comments = true
