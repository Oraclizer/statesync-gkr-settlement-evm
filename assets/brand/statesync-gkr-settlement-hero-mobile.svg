<svg xmlns="http://www.w3.org/2000/svg" width="640" height="320" viewBox="0 0 640 320" role="img" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet">
  <title id="title">StateSync-GKR Settlement EVM for narrow screens</title>
  <desc id="desc">A compact mobile banner where receipt roots pass through quorum checks into a fail-closed settlement decision beside the StateSync-GKR Settlement EVM name.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061513"/><stop offset=".58" stop-color="#0a2422"/><stop offset="1" stop-color="#12312d"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0v28" fill="none" stroke="#75e3b0" stroke-width="1" opacity=".035"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#75e3b0"/></marker>
  </defs>
  <rect width="640" height="320" rx="24" fill="url(#bg)"/>
  <rect width="640" height="320" rx="24" fill="url(#grid)"/>
  <path d="M28 72V28h44M568 28h44v44M28 248v44h44M568 292h44v-44" fill="none" stroke="#75e3b0" stroke-width="2" opacity=".12"/>
  <g transform="translate(46 70)">
    <g fill="#0a2224" stroke="#3d7669" stroke-width="2"><rect x="0" y="0" width="32" height="32" rx="7"/><rect x="42" y="0" width="32" height="32" rx="7"/><rect x="0" y="42" width="32" height="32" rx="7"/><rect x="42" y="42" width="32" height="32" rx="7"/><rect x="0" y="84" width="32" height="32" rx="7"/><rect x="42" y="84" width="32" height="32" rx="7"/></g>
    <g fill="#75e3b0"><circle cx="16" cy="16" r="5"/><circle cx="58" cy="58" r="5"/><circle cx="16" cy="100" r="5"/></g>
    <path d="M74 16h32l34 42M74 58h66M74 100h32l34-42" fill="none" stroke="#66b8d2" stroke-width="3"/>
    <circle cx="140" cy="58" r="9" fill="#66b8d2"/><path d="M149 58h42" stroke="#75e3b0" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="196" y="18" width="62" height="80" rx="12" fill="#091d1b" stroke="#75e3b0" stroke-width="2"/>
    <path d="M210 40h34M210 57h26M210 74h34" stroke="#75e3b0" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="324" y="56" fill="#75e3b0" font-size="12" font-weight="700" letter-spacing="1.8">DETERMINISTIC EVM REFERENCE</text>
    <text x="320" y="112" fill="#75e3b0" font-size="38" font-weight="800">SS-GKR</text>
    <text x="320" y="154" fill="#f3f7f4" font-size="34" font-weight="800">SETTLEMENT EVM</text>
    <rect x="324" y="174" width="72" height="5" rx="2.5" fill="#75e3b0"/>
    <text x="324" y="214" fill="#d5e4e0" font-size="16" font-weight="650">DESTINATION ENFORCEMENT FOR</text>
    <text x="324" y="241" fill="#d5e4e0" font-size="16" font-weight="650">STATESYNC-GKR RECEIPTS</text>
  </g>
</svg>
